<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>글 상세보기</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h1>🚀 게시글 상세보기</h1>
            <button type="button" class="btn btn-outline-secondary" onclick="location.href='/logout'">로그아웃</button>
        </div>

        <div th:if="${!verified}" class="mt-4">
            <p>제목: <span th:text="${post.title}"></span></p>
            <p>작성자: <span th:text="${post.author}"></span></p>
            <p>이 글은 비밀번호로 보호되어 있습니다. 내용을 보려면 비밀번호를 확인하세요.</p>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary" th:onclick="|openPasswordPopup(${post.id})|">비밀번호 확인</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='/'">목록으로</button>
            </div>
        </div>

        <div th:if="${verified}" class="mt-4">
            <h3 th:text="${post.title}"></h3>
            <p class="text-muted">
                작성자: <span th:text="${post.author}"></span>
                &middot; 최종수정일: <span th:text="${#temporals.format(post.modifiedDate, 'yyyy-MM-dd HH:mm')}"></span>
            </p>
            <hr>
            <p th:text="${post.content}" style="white-space: pre-line;"></p>
            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-secondary" onclick="location.href='/'">목록으로</button>
                <button type="button" class="btn btn-primary" th:onclick="|location.href='@{/posts/update/{id}(id=${post.id})}'|">수정</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openPasswordPopup(id) {
            window.open('/posts/' + id + '/verify-popup', 'pwPopup', 'width=400,height=280,scrollbars=yes,resizable=yes');
        }
    </script>
</body>
</html>
