<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>글 상세보기</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 목록에서 팝업 창(window.open)으로 열리는 걸 전제로 한 화면이라 상단 메뉴/로그아웃 없이 내용만 보여준다 -->
    <div class="container mt-3">
        <h4>🚀 게시글 상세보기</h4>

        <div th:if="${passwordError}" class="alert alert-danger mt-3">비밀번호가 일치하지 않습니다.</div>

        <div th:if="${!verified}" class="mt-3">
            <p class="mb-1">제목: <span th:text="${post.title}"></span></p>
            <p>작성자: <span th:text="${post.author}"></span></p>
            <p>이 글은 비밀번호로 보호되어 있습니다. 내용을 보려면 비밀번호를 입력하세요.</p>
            <form th:action="@{/posts/{id}/verify(id=${post.id})}" method="post" class="row g-2">
                <div class="col-auto">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호" required autofocus>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">확인</button>
                    <button type="button" class="btn btn-secondary" onclick="window.close()">닫기</button>
                </div>
            </form>
        </div>

        <div th:if="${verified}" class="mt-3">
            <h5 th:text="${post.title}"></h5>
            <p class="text-muted">
                작성자: <span th:text="${post.author}"></span>
                &middot; 최종수정일: <span th:text="${#temporals.format(post.modifiedDate, 'yyyy-MM-dd HH:mm')}"></span>
            </p>
            <hr>
            <p th:text="${post.content}" style="white-space: pre-line;"></p>
            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-primary" th:onclick="|location.href='@{/posts/update/{id}(id=${post.id})}'|">수정</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">닫기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
