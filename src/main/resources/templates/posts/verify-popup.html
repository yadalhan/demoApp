<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>비밀번호 확인</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body { font-family: sans-serif; margin: 16px; font-size: 14px; }
        p { margin: 0 0 10px; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 10px; }
        .error { color: #c0392b; margin-bottom: 10px; }
        .buttons { text-align: right; }
        button { padding: 5px 12px; margin-left: 6px; }
    </style>
</head>
<body>
    <p>비밀번호를 입력하세요.</p>
    <div th:if="${passwordError}" class="error">비밀번호가 일치하지 않습니다.</div>
    <form th:action="@{/posts/{id}/verify-popup(id=${postId})}" method="post">
        <input type="password" name="password" placeholder="비밀번호" required autofocus>
        <div class="buttons">
            <button type="button" onclick="window.close()">닫기</button>
            <button type="submit">확인</button>
        </div>
    </form>
</body>
</html>
