<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>비밀번호 확인</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-3">
        <h5>🔒 비밀번호 확인</h5>
        <div th:if="${passwordError}" class="alert alert-danger mt-2 py-2">비밀번호가 일치하지 않습니다.</div>
        <p class="text-muted">이 글은 비밀번호로 보호되어 있습니다. 내용을 보려면 비밀번호를 입력하세요.</p>
        <form th:action="@{/posts/{id}/verify-popup(id=${postId})}" method="post">
            <input type="password" name="password" class="form-control" placeholder="비밀번호" required autofocus>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">확인</button>
                <button type="button" class="btn btn-secondary" onclick="window.close()">닫기</button>
            </div>
        </form>
    </div>
</body>
</html>
