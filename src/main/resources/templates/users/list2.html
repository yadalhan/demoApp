<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>사용자 목록2</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h1>🚀 사용자 목록2 <small class="text-muted fs-6">(Redis 캐시)</small></h1>
            <div>
                <button class="btn btn-outline-primary" onclick="location.href='/users'">사용자 목록</button>
                <button class="btn btn-outline-secondary" onclick="location.href='/logout'">로그아웃</button>
            </div>
        </div>

        <form method="get" th:action="@{/users2}" class="row g-2 align-items-end mt-4">
            <div class="col-auto">
                <label class="form-label">이름</label>
                <input type="text" class="form-control" name="name" th:value="${name}" placeholder="이름(부분 검색)">
            </div>
            <div class="col-auto">
                <label class="form-label">주민등록번호</label>
                <input type="text" class="form-control" name="residentRegistrationNumber" th:value="${residentRegistrationNumber}"
                       inputmode="numeric" placeholder="숫자만 입력 (정확히 일치)"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="col-auto">
                <label class="form-label">전화번호</label>
                <input type="text" class="form-control" name="phone" th:value="${phone}"
                       inputmode="numeric" placeholder="숫자만 입력 (정확히 일치)"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">검색</button>
                <button type="button" class="btn btn-outline-secondary" onclick="location.href='/users2'">초기화</button>
            </div>
        </form>

        <table class="table table-horizontal table-bordered mt-4">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>사용자 ID</th>
                <th>이름</th>
                <th>전화번호</th>
                <th>주민등록번호</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.userId}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.phone}"></td>
                <td th:text="${user.residentRegistrationNumber}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="text-center text-muted">검색 결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
