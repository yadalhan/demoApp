<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            border: none;
            background: none;
            color: #6c757d;
            padding: 0;
        }
        .password-toggle:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">📝 회원가입</h3>
                        
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        </div>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="userId" class="form-label">사용자 ID</label>
                                <input type="text" class="form-control" id="userId" name="userId" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">사용자 이름</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">주민등록번호</label>
                                <div class="row g-2 align-items-center">
                                    <div class="col">
                                        <input type="text" class="form-control" id="residentRegistrationNumberFront" name="residentRegistrationNumberFront" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="앞 6자리" required>
                                    </div>
                                    <div class="col-auto text-muted">-</div>
                                    <div class="col">
                                        <input type="password" class="form-control" id="residentRegistrationNumberBack" name="residentRegistrationNumberBack" inputmode="numeric" pattern="\d{7}" maxlength="7" placeholder="뒤 7자리" required>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                        <i id="passwordIcon" class="bi bi-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                        <i id="confirmPasswordIcon" class="bi bi-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">회원가입</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="location.href='/login'">로그인 페이지로</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const iconId = inputId + 'Icon';
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        }
        
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            const data = {
                userId: document.getElementById('userId').value,
                username: document.getElementById('username').value,
                residentRegistrationNumberFront: document.getElementById('residentRegistrationNumberFront').value,
                residentRegistrationNumberBack: document.getElementById('residentRegistrationNumberBack').value,
                password: password
            };
            
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(data)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/login?registered';
                } else {
                    return response.text().then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const errorDiv = doc.querySelector('.alert-danger');
                        if (errorDiv) {
                            alert(errorDiv.textContent.trim());
                        } else {
                            alert('회원가입에 실패했습니다.');
                        }
                    });
                }
            })
            .catch(error => {
                alert('회원가입 중 오류가 발생했습니다.');
                console.error(error);
            });
        });
    </script>
</body>
</html>
