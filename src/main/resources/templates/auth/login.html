<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            border: none;
            background: none;
            color: #6c757d;
            padding: 0;
        }
        .password-toggle:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">🔐 로그인</h3>
                        
                        <div th:if="${param.registered}" class="alert alert-success">
                            회원가입이 완료되었습니다. 로그인해 주세요.
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="userId" class="form-label">사용자 ID</label>
                                <input type="text" class="form-control" id="userId" name="userId" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <button type="button" class="password-toggle" onclick="togglePassword()">
                                        <i id="passwordIcon" class="bi bi-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">로그인</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="location.href='/register'">회원가입</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'bi bi-eye';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'bi bi-eye-slash';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                userId: document.getElementById('userId').value,
                password: document.getElementById('password').value
            };
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(data)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    return response.text().then(html => {
                        // Extract error message from the response HTML
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const errorDiv = doc.querySelector('.alert-danger');
                        if (errorDiv) {
                            alert(errorDiv.textContent.trim());
                        } else {
                            alert('로그인에 실패했습니다.');
                        }
                    });
                }
            })
            .catch(error => {
                alert('로그인 중 오류가 발생했습니다.');
                console.error(error);
            });
        });
    </script>
</body>
</html>
