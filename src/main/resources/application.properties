spring.application.name=demo

# JPA
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.url= jdbc:postgresql://192.168.2.57:21716/limadb?currentSchema=ebiz
spring.datasource.username=postgres
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Vault Configuration
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=spring-boot-vault-token
spring.cloud.vault.generic.enabled=true
spring.cloud.vault.generic.backend=secret
spring.cloud.vault.generic.application-name=demoApp
spring.cloud.vault.fail-fast=false